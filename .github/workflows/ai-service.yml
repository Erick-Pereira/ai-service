# Secrets: DOCKER_USERNAME, DOCKER_PASSWORD, TOKEN

name: ai-service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: GitHub Packages (Simcag.Shared)
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          dotnet nuget remove source github 2>/dev/null || true
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.repository_owner }}" \
            --password "${TOKEN}" \
            --store-password-in-clear-text
      - name: Run tests
        run: dotnet test Simcag.AIService.Tests/Simcag.AIService.Tests.csproj -c Release

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: shelow/ai-service:latest
          context: .
          file: Simcag.AIService.Api/Dockerfile
          build-args: |
            TOKEN=${{ secrets.TOKEN }}
            NUGET_GITHUB_OWNER=${{ github.repository_owner }}
